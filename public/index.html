<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>War.app AI Benchmark</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>War.app AI Benchmark</h1>
        <p>Medium Earth Traditional, simultaneous 1v1, no cards</p>
      </div>
      <div class="status" id="status">Idle</div>
    </header>

    <main class="layout">
      <aside class="panel controls">
        <label>
          Bot A
          <select id="botA"></select>
        </label>
        <label>
          Bot B
          <select id="botB"></select>
        </label>
        <div class="field-group">
          <label for="seed">Seed</label>
          <div class="seed-row">
            <input id="seed" value="42">
            <label class="checkbox-label">
              <input id="seedLocked" type="checkbox">
              Locked
            </label>
          </div>
        </div>
        <label>
          Bot timeout (ms)
          <input id="timeLimitMs" type="number" min="100" step="100" value="5000">
        </label>
        <div class="button-row">
          <button id="runMatch">Run Match</button>
          <button id="runTournament">Elo Test</button>
        </div>

        <section class="control-section">
          <h2>History</h2>
          <div class="history-meta" id="historyMeta">No replay</div>
          <input id="scrubber" type="range" min="0" max="0" value="0">
          <div class="history-buttons">
            <button id="stepTurnBack" title="Previous turn">&lt;&lt;</button>
            <button id="stepBack" title="Previous order">&lt;</button>
            <button id="stepForward" title="Next order">&gt;</button>
            <button id="stepTurnForward" title="Next turn">&gt;&gt;</button>
          </div>
          <div class="button-row">
            <button id="beginning">Beginning</button>
            <button id="end">End</button>
          </div>
          <label>
            Perspective
            <select id="perspective">
              <option value="all">All</option>
              <option value="0">Bot A</option>
              <option value="1">Bot B</option>
            </select>
          </label>
          <div class="button-row">
            <button id="playPause">Play</button>
          </div>
          <label>
            Playback speed
            <input id="speed" type="range" min="100" max="1600" step="100" value="700">
          </label>
        </section>

        <section class="control-section">
          <h2>Result</h2>
          <dl class="result-list" id="resultList"></dl>
        </section>
      </aside>

      <section class="board-panel">
        <div class="board-toolbar">
          <div id="turnTitle">No replay loaded</div>
          <div class="legend">
            <span><i class="p0"></i> Bot A</span>
            <span><i class="p1"></i> Bot B</span>
            <span><i class="neutral"></i> Neutral</span>
          </div>
        </div>
        <div class="board-wrap">
          <svg id="board" role="img" aria-label="Medium Earth benchmark board"></svg>
        </div>
      </section>

      <aside class="panel inspect">
        <section>
          <h2>Orders</h2>
          <ol id="eventLog" class="event-log"></ol>
        </section>
        <section>
          <h2>Players</h2>
          <div class="score-grid" id="scoreGrid"></div>
        </section>
        <section>
          <h2>Territory</h2>
          <div id="territoryDetails" class="territory-details">Select an army number on the board.</div>
        </section>
        <section>
          <h2>Tournament</h2>
          <div id="tournamentResults" class="tournament-results">Run an Elo test to compare bots.</div>
        </section>
      </aside>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
